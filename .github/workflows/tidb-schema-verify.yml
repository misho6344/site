name: Verify TiDB application schema

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tidb-schema-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noadframe-tidb-schema-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tidb-primary-enzonic-secondary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm all application tables exist (read-only)
        env:
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
          APPLY_SCHEMA: "false"
        run: npm run schema:prepare
