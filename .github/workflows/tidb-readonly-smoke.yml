name: TiDB application smoke test (read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tidb-readonly-smoke.yml
      - scripts/smoke-test-tidb.js
      - package.json
      - package-lock.json
      - scripts/compare-database-content.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noadframe-tidb-readonly-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Verify TiDB application tables and migrated data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: feature/tidb-primary-enzonic-secondary
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run strictly read-only TiDB smoke test
        env:
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
        run: npm run smoke:tidb:readonly
