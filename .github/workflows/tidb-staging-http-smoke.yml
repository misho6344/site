name: TiDB staging HTTP smoke test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tidb-staging-http-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noadframe-tidb-staging-http-smoke
  cancel-in-progress: false

jobs:
  http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public staging endpoints (GET only)
        env:
          STAGING_URL: https://noadframe-tidb-test.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.STAGING_URL;
          const checks = [
            ["/api/health", data => data.ok === true && data.database === "ready"],
            ["/api/ready", data => data.status === "ready" && data.database === "connected"],
            ["/api/movies?limit=3", data => Array.isArray(data.movies) && Number(data.total) >= 1],
            ["/api/movies/categories", data => Array.isArray(data.popular) && Array.isArray(data.topRated) && Array.isArray(data.newReleases)],
            ["/api/genres", data => Array.isArray(data.genres) && Array.isArray(data.years)],
            ["/api/site-banner", data => typeof data.active === "boolean" && typeof data.imageUrl === "string"],
            ["/api/site-banners", data => Array.isArray(data.banners)]
          ];
          for (const [path, validate] of checks) {
            let response;
            for (let attempt = 0; attempt < 6; attempt++) {
              try {
                response = await fetch(base + path, { headers: { "Accept": "application/json" }, signal: AbortSignal.timeout(12000) });
                if (response.ok) break;
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!response || !response.ok) throw new Error(path + " returned " + (response?.status || "no response"));
            const data = await response.json();
            if (!validate(data)) throw new Error(path + " returned an unexpected response shape");
            console.log("PASS GET", path, response.status);
          }
          const blocked = await fetch(base + "/api/client-errors", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}", signal: AbortSignal.timeout(12000) });
          if (blocked.status !== 405) throw new Error("Read-only write guard expected HTTP 405, got " + blocked.status);
          console.log("PASS POST /api/client-errors blocked with HTTP 405.");
          const adminBase = "https://noadframe-admin-staging.onrender.com";
          const adminPage = await fetch(adminBase + "/", { signal: AbortSignal.timeout(12000) });
          if (!adminPage.ok) throw new Error("Admin staging page returned " + adminPage.status);
          console.log("PASS Admin Panel staging page", adminPage.status);
          const csrfResponse = await fetch(adminBase + "/api/csrf", { headers: { "Accept": "application/json" }, signal: AbortSignal.timeout(12000) });
          if (!csrfResponse.ok || typeof (await csrfResponse.json()).csrfToken !== "string") throw new Error("Admin staging CSRF endpoint failed");
          console.log("PASS Admin Panel CSRF endpoint", csrfResponse.status);
          const protectedEvents = await fetch(adminBase + "/api/security/events", { headers: { "Accept": "application/json" }, signal: AbortSignal.timeout(12000) });
          if (protectedEvents.status !== 401) throw new Error("Admin security events should require authentication; got " + protectedEvents.status);
          console.log("PASS Admin security events remain authentication-protected", protectedEvents.status);
          console.log("PASS: staging HTTP checks completed; no database writes were performed.");
          NODE
