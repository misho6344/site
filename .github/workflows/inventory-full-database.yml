name: Full database inventory (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noadframe-full-database-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Inspect Enzonic and TiDB without modifying data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: feature/tidb-primary-enzonic-secondary

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run read-only inventory
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          npm run inventory:full > database-inventory.json
          cat database-inventory.json

      - name: Upload inventory report
        uses: actions/upload-artifact@v4
        with:
          name: noadframe-database-inventory
          path: database-inventory.json
          if-no-files-found: error
          retention-days: 14
