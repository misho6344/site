name: NoAdFrame recovery dry-run plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: feature/tidb-primary-enzonic-secondary
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked project dependencies
        run: npm ci
      - name: Read-only recovery dependency and schema plan
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
        run: node scripts/plan-site-settings-restore.js
