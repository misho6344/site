name: Database content comparison (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noadframe-database-content-comparison
  cancel-in-progress: false

jobs:
  compare:
    name: Compare Enzonic and TiDB row contents and table definitions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: feature/tidb-primary-enzonic-secondary

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Compare row hashes and table DDL (read-only)
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          npm run compare:database:content > database-content-comparison.json
          cat database-content-comparison.json

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: noadframe-database-content-comparison
          path: database-content-comparison.json
          if-no-files-found: error
          retention-days: 14
